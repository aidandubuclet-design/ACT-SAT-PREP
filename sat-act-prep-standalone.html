<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Testing Room — SAT / ACT Prep</title>
<style>
:root{
  --ink:#1b2a4a;
  --ink-soft:#3c4a6b;
  --paper:#f6f3ea;
  --paper-line:#e2ddc9;
  --red:#b5402c;
  --green:#2f6d4f;
  --gold:#c99a3b;
  --mono:'Courier New', Courier, monospace;
  --serif:'Georgia', 'Iowan Old Style', serif;
  --sans:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  background-image:
    linear-gradient(var(--paper-line) 1px, transparent 1px);
  background-size: 100% 32px;
  color:var(--ink);
  font-family:var(--sans);
  min-height:100vh;
}
.wrap{max-width:840px;margin:0 auto;padding:28px 20px 80px;}
header.top{
  display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:3px solid var(--ink);
  padding-bottom:12px;margin-bottom:24px;
}
header.top .brand{
  font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:.3px;
}
header.top .brand small{
  display:block;font-family:var(--mono);font-size:11px;font-weight:400;
  letter-spacing:2px;color:var(--ink-soft);text-transform:uppercase;margin-top:2px;
}
.ticket{
  font-family:var(--mono);font-size:12px;color:var(--ink-soft);text-align:right;
}
.card{
  background:#fffdf7;border:1px solid var(--paper-line);
  box-shadow:2px 2px 0 var(--paper-line);
  border-radius:2px;padding:24px;margin-bottom:20px;
}
h1,h2,h3{font-family:var(--serif);margin-top:0;}
h2.section-title{
  font-size:15px;text-transform:uppercase;letter-spacing:1.5px;
  color:var(--ink-soft);font-family:var(--mono);border-bottom:1px solid var(--paper-line);
  padding-bottom:8px;margin-bottom:16px;
}
.testGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:600px){.testGrid{grid-template-columns:1fr;}}
.testPick{
  border:2px solid var(--ink);padding:20px;background:#fffdf7;
}
.testPick h3{margin:0 0 6px;font-size:20px;}
.testPick p{margin:0;color:var(--ink-soft);font-size:13px;line-height:1.5;}
.testPick .meta{
  font-family:var(--mono);font-size:11px;color:var(--gold);margin-top:10px;
  letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;
}
.modeRow{display:flex;gap:10px;flex-wrap:wrap;}
.modeBtn{
  flex:1;min-width:120px;font-family:var(--mono);font-size:11.5px;letter-spacing:.5px;
  text-transform:uppercase;padding:11px 10px;cursor:pointer;border-radius:2px;text-align:center;
  transition:transform .1s ease, box-shadow .1s ease;
}
.modeBtn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink);}
.modeBtn.tutor{background:#2c3f63;color:#fff;border:2px solid var(--ink);}
.modeBtn.testmode{background:transparent;color:var(--ink);border:2px solid var(--ink);}
.modePill{
  display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;
  padding:3px 9px;border-radius:10px;border:1px solid var(--gold);color:var(--gold);margin-left:8px;
}
.hint{
  font-family:var(--sans);font-size:13.5px;line-height:1.6;padding:12px 14px;margin-top:4px;margin-bottom:18px;
  border-radius:2px;
}
.hint.wrong{background:#f6eae7;border-left:3px solid var(--red);color:var(--red);}
.hint.right{background:#eaf3ee;border-left:3px solid var(--green);color:var(--green);}
.hint .body{color:var(--ink-soft);margin-top:6px;font-weight:400;}
.choice.locked{cursor:not-allowed;opacity:.55;}
.troublePanel{margin-top:16px;}
.trouble-tag-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--paper-line);font-size:13px;}
.trouble-tag-row:last-child{border-bottom:none;}
.trouble-rate{font-family:var(--mono);font-size:11px;color:var(--red);}
.menuRow{display:flex;justify-content:space-between;margin-bottom:16px;}
.menuBtn{
  font-family:var(--mono);font-size:11px;letter-spacing:.5px;text-transform:uppercase;
  background:transparent;border:1px solid var(--paper-line);color:var(--ink-soft);
  padding:7px 12px;border-radius:2px;cursor:pointer;
}
.menuBtn:hover{border-color:var(--ink);color:var(--ink);}
.menuBtn.restart:hover{border-color:var(--red);color:var(--red);}
.resumeBar{
  position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--paper);
  padding:14px 20px;z-index:50;box-shadow:0 -2px 10px rgba(0,0,0,.2);
}
.resumeBar .inner{max-width:840px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.resumeBar .info{flex:1;min-width:180px;}
.resumeBar .info .title{font-family:var(--serif);font-size:15px;margin-bottom:4px;}
.resumeBar .info .sub{font-family:var(--mono);font-size:11px;color:#cfcabb;}
.resumeTrack{height:6px;background:#3c4a6b;border-radius:3px;margin-top:6px;width:100%;max-width:260px;overflow:hidden;}
.resumeFill{height:100%;background:var(--gold);}
.resumeBar .btns{display:flex;gap:8px;flex-wrap:wrap;}
.resumeBar button{
  font-family:var(--mono);font-size:11px;letter-spacing:.5px;text-transform:uppercase;
  padding:9px 14px;border-radius:2px;cursor:pointer;border:1px solid var(--paper);
}
.resumeBar .btnResume{background:var(--gold);color:var(--ink);border-color:var(--gold);}
.resumeBar .btnRestart{background:transparent;color:var(--paper);}
.resumeBar .btnDiscard{background:transparent;color:#cfcabb;border-color:#5a6789;}
body.hasResumeBar .wrap{padding-bottom:110px;}
.timerBadge{
  position:fixed;top:16px;right:16px;z-index:70;
  font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.5px;
  background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:14px;
  box-shadow:2px 2px 0 var(--paper-line);
}
.timerBadge.timerLow{background:var(--red);}
.timerBadge.timerOver{background:var(--red);}
.timerSettings{margin-top:6px;}
.timerSettings label{display:block;font-family:var(--sans);font-size:13px;color:var(--ink-soft);margin-bottom:8px;cursor:pointer;}
.timerSettings .presetGroup{margin-left:22px;margin-top:6px;margin-bottom:10px;display:none;}
.timerSettings .presetGroup.open{display:block;}
.timerSettings .presetGroup label{font-size:12.5px;margin-bottom:6px;}
.timerSettings input[type="number"]{
  font-family:var(--mono);font-size:12.5px;width:70px;padding:4px 6px;
  border:1px solid var(--paper-line);border-radius:2px;margin-left:6px;
}
button.primary{
  font-family:var(--mono);font-size:13px;letter-spacing:1px;text-transform:uppercase;
  background:var(--ink);color:var(--paper);border:none;padding:12px 22px;
  cursor:pointer;border-radius:2px;
}
button.primary:hover{background:var(--ink-soft);}
button.ghost{
  font-family:var(--mono);font-size:12px;letter-spacing:1px;text-transform:uppercase;
  background:transparent;color:var(--ink);border:1px solid var(--ink);padding:10px 18px;
  cursor:pointer;border-radius:2px;
}
button.ghost:hover{background:var(--ink);color:var(--paper);}
.progressRow{
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--mono);font-size:12px;color:var(--ink-soft);margin-bottom:18px;
}
.timer{font-weight:700;color:var(--ink);}
.progbar{height:5px;background:var(--paper-line);width:100%;margin:4px 0 18px;}
.progbar .fill{height:100%;background:var(--gold);transition:width .25s ease;}
.qTag{
  display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:1px;
  text-transform:uppercase;color:#fff;background:var(--ink-soft);padding:3px 8px;
  border-radius:10px;margin-bottom:12px;
}
.passage{
  font-family:var(--serif);font-size:15px;line-height:1.7;background:#fbf9f2;
  border-left:3px solid var(--gold);padding:14px 18px;margin-bottom:18px;
  white-space:pre-wrap;
}
.qtext{font-size:16px;line-height:1.6;margin-bottom:16px;}
.qtext .underline{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;}
.choices{display:flex;flex-direction:column;gap:10px;margin-bottom:22px;}
.choice{
  display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--paper-line);
  cursor:pointer;background:#fffdf7;transition:border-color .12s ease, background .12s ease;
}
.choice:hover{border-color:var(--ink-soft);}
.choice.selected{border-color:var(--ink);background:#efe9d8;}
.bubble{
  width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);flex:0 0 22px;
  position:relative;
}
.bubble.filled::after{
  content:'';position:absolute;inset:3px;border-radius:50%;background:var(--ink);
}
.choice.correct{border-color:var(--green);background:#eaf3ee;}
.choice.correct .bubble{border-color:var(--green);}
.choice.correct .bubble::after{background:var(--green);}
.choice.incorrect{border-color:var(--red);background:#f6eae7;}
.choice.incorrect .bubble{border-color:var(--red);}
.choice.incorrect .bubble::after{background:var(--red);}
.choiceLabel{font-family:var(--mono);font-weight:700;margin-right:2px;}
.navRow{display:flex;justify-content:space-between;align-items:center;gap:12px;}
.explain{
  font-family:var(--sans);font-size:13.5px;line-height:1.6;background:#fbf9f2;
  border:1px dashed var(--paper-line);padding:12px 14px;margin-top:-6px;margin-bottom:20px;
  color:var(--ink-soft);
}
.scoreBig{font-family:var(--serif);font-size:52px;font-weight:700;margin:0;}
.scoreRow{display:flex;gap:28px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px;}
.skillBar{margin-bottom:14px;}
.skillBar .lbl{
  display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;
  margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;
}
.skillTrack{height:10px;background:var(--paper-line);border-radius:5px;overflow:hidden;}
.skillFill{height:100%;border-radius:5px;}
.skillFill.weak{background:var(--red);}
.skillFill.mid{background:var(--gold);}
.skillFill.strong{background:var(--green);}
.lesson{
  border-left:3px solid var(--red);background:#fbf3f0;padding:14px 18px;margin-bottom:14px;
}
.lesson h4{margin:0 0 6px;font-family:var(--serif);font-size:16px;}
.lesson p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink-soft);}
.footerNote{font-family:var(--mono);font-size:11px;color:var(--ink-soft);text-align:center;margin-top:30px;}
.tag-pill-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.pill{
  font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:12px;
  border:1px solid var(--ink-soft);color:var(--ink-soft);
}
.hidden{display:none !important;}
a.linklike{color:var(--ink);text-decoration:underline;cursor:pointer;font-family:var(--mono);font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">The Testing Room<small>Purdue Prep · Diagnostic Practice</small></div>
    <div class="ticket" id="ticketBox">NO. 001<br>SEAT —</div>
  </header>

  <div id="app"></div>
  <div class="footerNote">Original practice material written for this app — not sourced from official SAT/ACT test forms.<br>Your progress and trouble log are saved on this device/browser only.</div>
</div>

<script>
/* ============================= DATA ============================= */

const ACT_ENGLISH = [
 {id:"e1",tag:"punctuation",prompt:"The museum's new exhibit, {u}which features artifacts from ancient Egypt opened{/u} last Friday to record crowds.",choices:["NO CHANGE","which features artifacts from ancient Egypt, opened","which features artifacts from ancient Egypt opened,","which features artifacts, from ancient Egypt, opened"],answer:1,explain:"The clause \"which features artifacts from ancient Egypt\" is nonessential and needs a comma on both sides — one after \"exhibit\" (already there) and one after \"Egypt\" before \"opened.\""},
 {id:"e2",tag:"punctuation",prompt:"Marcus studied every night for a month{u}, he still felt{/u} nervous before the exam.",choices:["NO CHANGE","; he still felt","he still felt",", but, he still felt"],answer:1,explain:"Two independent clauses can't be joined with just a comma (comma splice). A semicolon correctly joins them."},
 {id:"e3",tag:"punctuation",prompt:"Before leaving for the trip{u};{/u} Elena checked her passport, her tickets, and her phone charger.",choices:["NO CHANGE",",",". ","—"],answer:1,explain:"An introductory dependent clause is set off from the main clause with a comma, not a semicolon."},
 {id:"e4",tag:"sentence-structure",prompt:"Walking quickly through the rain, {u}the umbrella was left behind by Sarah{/u}.",choices:["NO CHANGE","the umbrella was left behind by Sarah while walking quickly through the rain","Sarah left the umbrella behind while walking quickly through the rain","an umbrella was left behind, walking quickly through the rain, by Sarah"],answer:2,explain:"The introductory phrase \"Walking quickly through the rain\" needs to modify a person, not \"the umbrella.\" Only choice C puts Sarah right after the comma."},
 {id:"e5",tag:"sentence-structure",prompt:"{u}Because the bridge was under construction.{/u} Commuters had to take a longer route to reach downtown.",choices:["NO CHANGE","Because the bridge was under construction, commuters","Because the bridge was under construction commuters","Because the bridge was under construction; commuters"],answer:1,explain:"\"Because the bridge was under construction\" is a dependent clause and can't stand alone as a sentence — it must be joined to the main clause with a comma."},
 {id:"e6",tag:"sentence-structure",prompt:"The committee reviewed dozens of applications, {u}choosing finally three finalists{/u} for the scholarship.",choices:["NO CHANGE","choosing three finalists finally","finally choosing three finalists","three finalists were finally chosen"],answer:2,explain:"\"Finally\" reads most naturally placed before the verb it modifies: \"finally choosing.\" This also keeps the sentence's structure parallel and active."},
 {id:"e7",tag:"agreement",prompt:"Neither of the twins {u}have finished{/u} their science project yet.",choices:["NO CHANGE","has finished","having finished","finish"],answer:1,explain:"\"Neither\" is a singular subject, so it takes the singular verb \"has finished.\""},
 {id:"e8",tag:"agreement",prompt:"Each of the employees {u}are required{/u} to submit their timesheet by Friday.",choices:["NO CHANGE","is required","were required","have been required"],answer:1,explain:"\"Each\" is singular, so the verb must be \"is required,\" not \"are required.\""},
 {id:"e9",tag:"agreement",prompt:"The team of scientists {u}were confident{/u} that their data supported the hypothesis.",choices:["NO CHANGE","was confident","is confident","had been confident, was"],answer:1,explain:"\"Team\" is a collective noun acting as a single unit here, so it takes the singular verb \"was confident.\""},
 {id:"e10",tag:"transitions",prompt:"The new policy reduced paperwork significantly. {u}However{/u}, employees reported spending more time on customer service.",choices:["NO CHANGE","As a result","In addition","For example"],answer:1,explain:"Freed-up time from less paperwork being spent on customer service is a consequence, not a contrast — \"As a result\" fits the logic better than \"However.\""},
 {id:"e11",tag:"transitions",prompt:"Sales dropped in the first quarter. {u}Nonetheless{/u}, the company doubled its marketing budget for the second quarter.",choices:["NO CHANGE","Consequently","Similarly","For instance"],answer:1,explain:"Doubling the marketing budget is a direct response to the sales drop, so \"Consequently\" (cause and effect) fits better than a contrast word."},
 {id:"e12",tag:"transitions",prompt:"The lecture covered the causes of the French Revolution in detail. {u}Similarly{/u}, it barely touched on its long-term effects on European monarchies.",choices:["NO CHANGE","Moreover","However","Therefore"],answer:2,explain:"\"In detail\" versus \"barely touched on\" is a contrast, so \"However\" is the logical transition."},
 {id:"e13",tag:"punctuation",prompt:"The recipe calls for three ingredients{u}: flour, sugar and butter{/u}.",choices:["NO CHANGE","; flour, sugar, and butter","flour, sugar, and butter","flour sugar and butter"],answer:0,explain:"A colon correctly introduces the list that follows \"three ingredients.\" NO CHANGE is correct as written."},
 {id:"e14",tag:"punctuation",prompt:"Dr. Alvarez, {u}who has taught biology for over twenty years{/u} recently published a textbook on marine ecosystems.",choices:["NO CHANGE","who has taught biology for over twenty years,","who has taught biology, for over twenty years,","whom has taught biology for over twenty years,"],answer:1,explain:"The nonessential clause describing Dr. Alvarez needs a closing comma before \"recently.\""},
 {id:"e15",tag:"punctuation",prompt:"The hikers packed extra water{u}, they knew the trail offered no shade{/u}.",choices:["NO CHANGE","because they knew the trail offered no shade","they knew, the trail offered no shade","; they, knew the trail offered no shade"],answer:1,explain:"The original is a comma splice joining two independent clauses. Adding \"because\" turns the second clause into a dependent clause, correctly connected without a comma splice."},
 {id:"e16",tag:"sentence-structure",prompt:"{u}Having finished the marathon in record time.{/u} Priya collapsed onto the grass, exhausted but proud.",choices:["NO CHANGE","Having finished the marathon in record time,","Finishing the marathon, in record time,","Having finished, the marathon in record time,"],answer:1,explain:"The introductory participial phrase is a fragment as written; a comma correctly joins it to the main clause about Priya."},
 {id:"e17",tag:"sentence-structure",prompt:"Trying to fix the leak quickly, {u}the wrench slipped from the plumber's hand{/u}.",choices:["NO CHANGE","the plumber's wrench slipped from his hand","the plumber's hand let the wrench slip","the plumber dropped the wrench from his hand"],answer:3,explain:"The opening phrase \"Trying to fix the leak quickly\" must modify a person, not \"the wrench.\" Only this choice puts the plumber, the one doing the trying, as the subject performing the action."},
 {id:"e18",tag:"sentence-structure",prompt:"The report was thorough. {u}Additionally covering every department's budget in detail.{/u}",choices:["NO CHANGE","additionally covering every department's budget in detail.","and it covered every department's budget in detail.","covering, additionally, every department's budget in detail."],answer:2,explain:"The second sentence is a fragment. Joining it to the first with \"and it covered\" creates a complete, properly connected sentence."},
 {id:"e19",tag:"agreement",prompt:"Everyone on the team {u}were given{/u} a personalized training plan before the season began.",choices:["NO CHANGE","was given","have been given","are given"],answer:1,explain:"\"Everyone\" is grammatically singular, so it takes the singular verb \"was given.\""},
 {id:"e20",tag:"agreement",prompt:"The number of applicants {u}have increased{/u} sharply since the position was advertised online.",choices:["NO CHANGE","has increased","were increasing","increase"],answer:1,explain:"\"The number\" (as opposed to \"a number\") is treated as singular, so it takes \"has increased.\""},
 {id:"e21",tag:"agreement",prompt:"Either the manager or the assistants {u}is responsible{/u} for locking up each night.",choices:["NO CHANGE","are responsible","was responsible","responsible"],answer:1,explain:"With \"either/or,\" the verb agrees with the noun closer to it — \"assistants,\" which is plural, so \"are responsible\" is correct."},
 {id:"e22",tag:"transitions",prompt:"The city council approved the new park's budget unanimously. {u}For example{/u}, construction is expected to begin within the month.",choices:["NO CHANGE","As a result,","In contrast,","On the other hand,"],answer:1,explain:"Construction beginning soon is a direct consequence of budget approval, so \"As a result\" is the logical transition, not \"For example.\""},
 {id:"e23",tag:"transitions",prompt:"The vaccine proved highly effective in early trials. {u}Nevertheless{/u}, researchers moved quickly into the next phase of testing.",choices:["NO CHANGE","Consequently,","Meanwhile,","In contrast,"],answer:1,explain:"Moving quickly to the next phase follows logically from strong early results, so \"Consequently\" fits better than a contrast word."}
];

const ACT_MATH = [
 {id:"am1",tag:"algebra",prompt:"Solve for x: 3x + 1 = 19",choices:["6", "7", "5", "8"],answer:0,explain:"3x = 19 - 1 = 18, so x = 18/3 = 6."},
 {id:"am2",tag:"algebra",prompt:"Solve for x: 5x + 4 = 24",choices:["4", "5", "3", "6"],answer:0,explain:"5x = 24 - 4 = 20, so x = 20/5 = 4."},
 {id:"am3",tag:"algebra",prompt:"Solve for x: 3x + 11 = 41",choices:["10", "11", "9", "12"],answer:0,explain:"3x = 41 - 11 = 30, so x = 30/3 = 10."},
 {id:"am4",tag:"algebra",prompt:"Solve for x: 3x + 10 = 34",choices:["8", "9", "7", "10"],answer:0,explain:"3x = 34 - 10 = 24, so x = 24/3 = 8."},
 {id:"am5",tag:"algebra",prompt:"Solve for x: 2x + 1 = 7",choices:["3", "4", "2", "5"],answer:0,explain:"2x = 7 - 1 = 6, so x = 6/2 = 3."},
 {id:"am6",tag:"algebra",prompt:"Solve for x: 5x + 4 = 54",choices:["10", "11", "9", "12"],answer:0,explain:"5x = 54 - 4 = 50, so x = 50/5 = 10."},
 {id:"am7",tag:"algebra",prompt:"Solve for x: 2x + 9 = 19",choices:["5", "6", "4", "7"],answer:0,explain:"2x = 19 - 9 = 10, so x = 10/2 = 5."},
 {id:"am8",tag:"algebra",prompt:"Solve for x: 8x + 4 = 76",choices:["9", "10", "8", "11"],answer:0,explain:"8x = 76 - 4 = 72, so x = 72/8 = 9."},
 {id:"am9",tag:"algebra",prompt:"Solve for x: 6x + 1 = 25",choices:["4", "5", "3", "6"],answer:0,explain:"6x = 25 - 1 = 24, so x = 24/6 = 4."},
 {id:"am10",tag:"algebra",prompt:"Solve for x: 8x + 6 = 54",choices:["6", "7", "5", "8"],answer:0,explain:"8x = 54 - 6 = 48, so x = 48/8 = 6."},
 {id:"am11",tag:"algebra",prompt:"Solve for x: 4x + 4 = 32",choices:["7", "8", "6", "9"],answer:0,explain:"4x = 32 - 4 = 28, so x = 28/4 = 7."},
 {id:"am12",tag:"algebra",prompt:"Solve for x: 3x + 2 = 26",choices:["8", "9", "7", "10"],answer:0,explain:"3x = 26 - 2 = 24, so x = 24/3 = 8."},
 {id:"am13",tag:"algebra",prompt:"Solve for x: 3x + 6 = 27",choices:["7", "8", "6", "9"],answer:0,explain:"3x = 27 - 6 = 21, so x = 21/3 = 7."},
 {id:"am14",tag:"algebra",prompt:"Solve for x: 6x + 1 = 55",choices:["9", "10", "8", "11"],answer:0,explain:"6x = 55 - 1 = 54, so x = 54/6 = 9."},
 {id:"am15",tag:"algebra",prompt:"Solve for x: 3x + 7 = 16",choices:["3", "4", "2", "5"],answer:0,explain:"3x = 16 - 7 = 9, so x = 9/3 = 3."},
 {id:"am116",tag:"geometry",prompt:"A right triangle has legs of length 3 and 4. What is the length of the hypotenuse?",choices:["5", "7", "3", "9"],answer:0,explain:"3-4-5 is a Pythagorean triple, so the hypotenuse is 5."},
 {id:"am117",tag:"geometry",prompt:"A right triangle has legs of length 6 and 8. What is the length of the hypotenuse?",choices:["10", "12", "8", "14"],answer:0,explain:"6-8-10 is a Pythagorean triple, so the hypotenuse is 10."},

/* ============================= TIMER PACING (Test Mode only) ============================= */
// Seconds per question, derived from official section times ÷ official question counts,
// then applied to however many questions THIS app's section actually has.
const TIMER_PACE_OFFICIAL = { // Classic ACT (this app's ACT format) + current Digital SAT
  "ACT-English": 36,    // 75q / 45min
  "ACT-Math": 60,       // 60q / 60min
  "ACT-Reading": 52.5,  // 40q / 35min
  "ACT-Science": 52.5,  // 40q / 35min
  "SAT-RW": 71.1,       // 54q / 64min
  "SAT-Math": 95.5      // 44q / 70min
};
const TIMER_PACE_ENHANCED_ACT = { // Current 2025–2026 "Enhanced ACT" — Science pacing unchanged
  "ACT-English": 42,    // 50q / 35min
  "ACT-Math": 67,       // 45q / 50min
  "ACT-Reading": 67,    // 36q / 40min
  "ACT-Science": 52.5,
  "SAT-RW": 71.1,
  "SAT-Math": 95.5
};
function secPerQuestion(sectionKey, prefs){
  if(!prefs) return 60;
  if(prefs.preset === "custom") return Math.max(5, prefs.customSecPerQ || 60);
  const table = prefs.preset === "enhanced_act" ? TIMER_PACE_ENHANCED_ACT : TIMER_PACE_OFFICIAL;
  return table[sectionKey] || 60;
}
function computeAndSetTimer(list){
  if(state.mode === "test" && state.timerPrefsUsed && state.timerPrefsUsed.enabled && list && list.length){
    const total = list.reduce((sum,q)=> sum + secPerQuestion(q.sectionKey, state.timerPrefsUsed), 0);
    state.timerEnabled = true;
    state.timerTotalSeconds = Math.round(total);
    state.timerSecondsRemaining = Math.round(total);
  } else {
    state.timerEnabled = false;
    state.timerTotalSeconds = 0;
    state.timerSecondsRemaining = 0;
  }
}
function formatClock(totalSeconds){
  const neg = totalSeconds < 0;
  const s = Math.abs(Math.round(totalSeconds));
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  const sec = s%60;
  const mm = String(m).padStart(2,'0');
  const ss = String(sec).padStart(2,'0');
  const core = h>0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
  return neg ? `+${core}` : core;
}
function getTimerPrefsFromForm(){
  const toggle = document.getElementById('timerEnableToggle');
  const enabled = toggle ? toggle.checked : false;
  const presetEl = document.querySelector('input[name="timerPreset"]:checked');
  const preset = presetEl ? presetEl.value : "official";
  const customEl = document.getElementById('timerCustomSec');
  const customSecPerQ = customEl ? (parseInt(customEl.value,10) || 60) : 60;
  return {enabled, preset, customSecPerQ};
}
function startTestModeFromHome(testKey){
  const prefs = getTimerPrefsFromForm();
  startTest(testKey, "test", prefs);
}

let timerIntervalId = null;
function updateTimerBadge(){
  const el = document.getElementById('timerBadge');
  if(!el) return;
  const overtime = state.timerSecondsRemaining < 0;
  const lowTime = !overtime && state.timerTotalSeconds>0 && (state.timerSecondsRemaining / state.timerTotalSeconds) <= 0.1;
  el.textContent = (overtime ? "Overtime " : "") + formatClock(state.timerSecondsRemaining);
  el.classList.toggle('timerLow', lowTime);
  el.classList.toggle('timerOver', overtime);
}
function manageTimerInterval(){
  const shouldRun = state.mode === "test" && state.timerEnabled && (state.view==="test" || state.view==="retest");
  if(shouldRun && !timerIntervalId){
    timerIntervalId = setInterval(()=>{
      state.timerSecondsRemaining -= 1;
      updateTimerBadge();
    }, 1000);
  }
  if(!shouldRun && timerIntervalId){
    clearInterval(timerIntervalId);
    timerIntervalId = null;
  }
}

/* ============================= MASTER QUESTION POOL ============================= */
// Every question, from every main bank AND every backup bank, indexed by id.
// This lets a saved/resumed session reconstruct its exact question list,
// and lets a restarted session draw a fresh mix that can include backup items.
const ALL_QUESTIONS_BY_ID = {};
function registerQuestions(list, sectionKey, sectionLabel){
  list.forEach(q=>{
    ALL_QUESTIONS_BY_ID[q.id] = Object.assign({}, q, {sectionKey, sectionLabel});
  });
}
TESTS.ACT.sections.concat(TESTS.SAT.sections).forEach(sec=>{
  registerQuestions(sec.questions, sec.key, sec.label);
  if(BACKUP[sec.key]){
    Object.values(BACKUP[sec.key]).forEach(arr=>registerQuestions(arr, sec.key, sec.label));
  }
});

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildSectionPool(sectionKey){
  const sec = TESTS.ACT.sections.concat(TESTS.SAT.sections).find(s=>s.key===sectionKey);
  let pool = sec.questions.map(q=>Object.assign({}, q, {sectionKey:sec.key, sectionLabel:sec.label}));
  if(BACKUP[sectionKey]){
    Object.values(BACKUP[sectionKey]).forEach(arr=>{
      arr.forEach(q=>pool.push(Object.assign({}, q, {sectionKey:sec.key, sectionLabel:sec.label})));
    });
  }
  return pool;
}

// Fresh draw for a testKey: same per-section question COUNT as the standard test,
// but shuffled and (where backup items exist) potentially swapped for variety.
function buildFreshTest(testKey){
  const t = TESTS[testKey];
  let flat = [];
  t.sections.forEach(sec=>{
    const pool = buildSectionPool(sec.key);
    const shuffled = shuffleArr(pool);
    flat = flat.concat(shuffled.slice(0, sec.questions.length));
  });
  return flat;
}

function serializeTutorStore(store){
  const out = {};
  Object.keys(store).forEach(qid=>{
    out[qid] = {wrongTried: Array.from(store[qid].wrongTried), solved: store[qid].solved};
  });
  return out;
}
function deserializeTutorStore(obj){
  const out = {};
  Object.keys(obj||{}).forEach(qid=>{
    out[qid] = {wrongTried: new Set(obj[qid].wrongTried), solved: obj[qid].solved};
  });
  return out;
}

async function saveInProgress(){
  if(!state.testKey || (state.view!=="test" && state.view!=="retest")) return;
  const payload = {
    testKey: state.testKey,
    mode: state.mode,
    activeFlow: state.view, // "test" or "retest"
    weakTags: state.weakTags,
    flatQuestionIds: state.flatQuestions.map(q=>q.id),
    answers: state.answers,
    currentIndex: state.currentIndex,
    tutorProgress: serializeTutorStore(state.tutorProgress),
    retestQuestionIds: state.retestQuestions.map(q=>q.id),
    retestAnswers: state.retestAnswers,
    retestIndex: state.retestIndex,
    retestTutorProgress: serializeTutorStore(state.retestTutorProgress),
    timerEnabled: state.timerEnabled,
    timerTotalSeconds: state.timerTotalSeconds,
    timerSecondsRemaining: state.timerSecondsRemaining,
    timerPrefsUsed: state.timerPrefsUsed,
    savedAt: Date.now()
  };
  try{
    localStorage.setItem('sat_act_inprogress', JSON.stringify(payload));
  }catch(e){ console.error('save in-progress failed', e); }
}

async function loadInProgress(){
  try{
    const raw = localStorage.getItem('sat_act_inprogress');
    if(!raw) return null;
    const p = JSON.parse(raw);
    p.flatQuestions = p.flatQuestionIds.map(id=>ALL_QUESTIONS_BY_ID[id]).filter(Boolean);
    p.retestQuestions = p.retestQuestionIds.map(id=>ALL_QUESTIONS_BY_ID[id]).filter(Boolean);
    return p;
  }catch(e){ return null; }
}

async function clearInProgress(){
  try{
    localStorage.removeItem('sat_act_inprogress');
  }catch(e){ /* nothing saved, fine */ }
}

async function loadTroubleLog(){
  // Standalone build: uses this phone/browser's local storage (works offline, no account needed).
  try{
    const raw = localStorage.getItem('sat_act_troublelog');
    return raw ? JSON.parse(raw) : {tags:{}, sessions:[]};
  }catch(e){
    return {tags:{}, sessions:[]};
  }
}

async function updateTroubleLog(tagStats){
  try{
    let existing = await loadTroubleLog();
    Object.keys(tagStats).forEach(tag=>{
      const s = tagStats[tag];
      if(!existing.tags[tag]) existing.tags[tag] = {wrong:0, seen:0};
      existing.tags[tag].seen += s.total;
      existing.tags[tag].wrong += (s.total - s.correct);
      existing.tags[tag].last = Date.now();
    });
    existing.sessions.push({date:Date.now(), testKey:state.testKey, mode:state.mode});
    if(existing.sessions.length>50) existing.sessions = existing.sessions.slice(-50);
    localStorage.setItem('sat_act_troublelog', JSON.stringify(existing));
  }catch(e){
    console.error('trouble log save failed', e);
  }
}

function findBackupQuestionsForTags(tags){
  let pool = [];
  Object.keys(BACKUP).forEach(sectionKey=>{
    const sectionLabel = (TESTS.ACT.sections.concat(TESTS.SAT.sections)).find(s=>s.key===sectionKey);
    const label = sectionLabel ? sectionLabel.label : sectionKey;
    tags.forEach(tag=>{
      if(BACKUP[sectionKey][tag]){
        BACKUP[sectionKey][tag].forEach(q=>{
          pool.push(Object.assign({}, q, {sectionKey, sectionLabel: label}));
        });
      }
    });
  });
  const seen = new Set();
  return pool.filter(q=>{ if(seen.has(q.id)) return false; seen.add(q.id); return true; });
}

function flattenTest(testKey){
  const t = TESTS[testKey];
  let flat = [];
  t.sections.forEach(sec=>{
    sec.questions.forEach(q=>flat.push(Object.assign({}, q, {sectionKey:sec.key, sectionLabel:sec.label})));
  });
  return flat;
}

function parseUnderline(text){
  return text.replace(/\{u\}/g,'<span class="underline">').replace(/\{\/u\}/g,'</span>');
}

      </div>
    </div>
  `;
}

function startFocusSession(){
  loadTroubleLog().then(log=>{
    const weak = Object.keys(log.tags).filter(t=>{
      const s = log.tags[t];
      return s.seen>=2 && (s.wrong/s.seen)>=0.4;
    });
    const pool = findBackupQuestionsForTags(weak);
    if(pool.length===0){ return; }
    state.testKey = "FOCUS";
    state.mode = "tutor";
    state.weakTags = weak;
    state.retestQuestions = pool;
    state.retestAnswers = {};
    state.retestIndex = 0;
    state.retestTutorProgress = {};
    state.timerPrefsUsed = null;
    computeAndSetTimer(state.retestQuestions);
    state.view = "retest";
    render();
  });
}

function startTest(testKey, mode, timerPrefs){
  state.testKey = testKey;
  state.mode = mode || "test";
  state.flatQuestions = buildFreshTest(testKey);
  state.answers = {};
  state.currentIndex = 0;
  state.startedAt = Date.now();
  state.tutorProgress = {};
  state.retestQuestions = [];
  state.retestAnswers = {};
  state.retestIndex = 0;
  state.retestTutorProgress = {};
  state.weakTags = [];
  state.timerPrefsUsed = (state.mode === "test") ? (timerPrefs || {enabled:false}) : null;
  computeAndSetTimer(state.flatQuestions);
  state.view = "test";
  saveInProgress();
  render();
}

function pauseToMenu(){
  // Leaves everything in memory + persisted — nothing is lost.
  // This is a deliberate checkpoint, so flush immediately rather than waiting on the debounce.
  // IMPORTANT: save BEFORE flipping the view — saveInProgress only writes while view is test/retest.
  if(saveDebounceTimer) clearTimeout(saveDebounceTimer);
  saveInProgress();
  state.view = "home";
  render();
}

function resumeInProgress(){
  if(!state.testKey || !state.activeFlow) return;
  state.view = state.activeFlow;
  render();
}

function restartCurrentTest(){
  if(!confirm("Restart with a fresh set of questions? Your progress on the current attempt will be cleared.")) return;
  if(state.testKey === "FOCUS"){
    const pool = findBackupQuestionsForTags(state.weakTags);
    state.retestQuestions = shuffleArr(pool);
    state.retestAnswers = {};
    state.retestIndex = 0;
    state.retestTutorProgress = {};
    computeAndSetTimer(state.retestQuestions);
    state.activeFlow = "retest";
    state.view = "retest";
  } else {
    state.flatQuestions = buildFreshTest(state.testKey);
    state.answers = {};
    state.currentIndex = 0;
    state.tutorProgress = {};
    computeAndSetTimer(state.flatQuestions);
    state.activeFlow = "test";
    state.view = "test";
  }
  saveInProgress();
  render();
}

function discardInProgress(){
  if(!confirm("Discard your saved progress? This can't be undone.")) return;
  clearInProgress();
  state = {view:"home", testKey:null, mode:"test", activeFlow:null, flatQuestions:[], answers:{}, currentIndex:0, startedAt:null, retestQuestions:[], retestAnswers:{}, retestIndex:0, weakTags:[], tutorProgress:{}, retestTutorProgress:{}, timerEnabled:false, timerTotalSeconds:0, timerSecondsRemaining:0, timerPrefsUsed:null};
  render();
}

function getTutorProgress(store, qid){
  if(!store[qid]) store[qid] = {wrongTried:new Set(), solved:false};
  return store[qid];
}

function renderTest(isRetest){
  const list = isRetest ? state.retestQuestions : state.flatQuestions;
  const idx = isRetest ? state.retestIndex : state.currentIndex;
  const answers = isRetest ? state.retestAnswers : state.answers;
  const tutorStore = isRetest ? state.retestTutorProgress : state.tutorProgress;
  const q = list[idx];
  if(!q){ return isRetest ? finishRetest() : finishTest(); }

  const total = list.length;
  const pct = Math.round(((idx)/total)*100);
  const isTutor = state.mode === "tutor";
  const selected = answers[q.id];
  const prog = isTutor ? getTutorProgress(tutorStore, q.id) : null;

  let passageHtml = "";
  if(q.passage){
    passageHtml = `<div class="passage">${q.passage.replace(/\n/g,'<br>')}</div>`;
  }

  const choicesHtml = q.choices.map((c,i)=>{
    let cls = "";
    let locked = false;
    if(isTutor){
      if(prog.wrongTried.has(i)){ cls = "incorrect"; locked = true; }
      if(prog.solved && i===q.answer){ cls = "correct"; }
      if(prog.solved && i!==q.answer && !prog.wrongTried.has(i)){ locked = true; }
    } else {
      if(selected===i) cls = "selected";
    }
    const clickAttr = locked ? "" : `onclick="handleChoiceClick('${q.id}', ${i}, ${isRetest})"`;
    return `<div class="choice ${cls} ${locked?'locked':''}" ${clickAttr}>
      <div class="bubble ${cls==='selected'||cls==='correct'?'filled':''}"></div>
      <div><span class="choiceLabel">${String.fromCharCode(65+i)}.</span> ${c}</div>
    </div>`;
  }).join("");

  let hintHtml = "";
  if(isTutor){
    if(prog.solved){
      hintHtml = `<div class="hint right">✓ Correct — here's why<div class="body">${q.explain}</div></div>`;
    } else if(prog.wrongTried.size>0){
      hintHtml = `<div class="hint wrong">✗ Not quite. Here's the rule that applies<div class="body">${q.explain}</div><div class="body" style="margin-top:6px;font-style:italic;">Try again — pick a different answer.</div></div>`;
    }
  }

  const canAdvance = isTutor ? prog.solved : selected!==undefined;

  app.innerHTML = `
    ${(state.mode==="test" && state.timerEnabled) ? `<div id="timerBadge" class="timerBadge ${state.timerSecondsRemaining<0?'timerOver':(state.timerTotalSeconds>0 && state.timerSecondsRemaining/state.timerTotalSeconds<=0.1?'timerLow':'')}">${state.timerSecondsRemaining<0?'Overtime ':''}${formatClock(state.timerSecondsRemaining)}</div>` : ''}
    <div class="card">
      <div class="menuRow">
        <button class="menuBtn" onclick="pauseToMenu()">← Menu (progress saved)</button>
        <button class="menuBtn restart" onclick="restartCurrentTest()">⟳ Restart</button>
      </div>
      <div class="progressRow">
        <span>${isRetest ? (state.testKey==="FOCUS" ? "FOCUS SESSION" : "TARGETED RETEST") : q.sectionLabel.toUpperCase()} · Q${idx+1} of ${total}</span>
        <span class="timer">${state.testKey==="FOCUS" ? "" : state.testKey} ${isTutor ? '<span class="modePill">TUTOR</span>' : '<span class="modePill" style="border-color:var(--ink-soft);color:var(--ink-soft);">TEST</span>'}</span>
      </div>
      <div class="progbar"><div class="fill" style="width:${pct}%"></div></div>
      <span class="qTag">${q.tag}</span>
      ${passageHtml}
      <div class="qtext">${parseUnderline(q.prompt)}</div>
      <div class="choices">${choicesHtml}</div>
      ${hintHtml}
      <div class="navRow">
        <span></span>
        <button class="primary" onclick="nextQuestion(${isRetest})" ${canAdvance?"":"disabled"}>
          ${idx+1===total ? "Finish" : "Next"} →
        </button>
      </div>
    </div>
  `;
}

function handleChoiceClick(qid, choiceIndex, isRetest){
  if(state.mode === "tutor"){
    const tutorStore = isRetest ? state.retestTutorProgress : state.tutorProgress;
    const answers = isRetest ? state.retestAnswers : state.answers;
    const list = isRetest ? state.retestQuestions : state.flatQuestions;
    const q = list.find(x=>x.id===qid);
    const prog = getTutorProgress(tutorStore, qid);
    if(prog.solved) return;
    if(choiceIndex === q.answer){
      prog.solved = true;
      answers[qid] = choiceIndex;
    } else {
      prog.wrongTried.add(choiceIndex);
    }
    render();
  } else {
    if(isRetest){ state.retestAnswers[qid] = choiceIndex; }
    else { state.answers[qid] = choiceIndex; }
    render();
  }
}

function nextQuestion(isRetest){
  if(isRetest){ state.retestIndex++; }
  else { state.currentIndex++; }
  render();
}

function scoreList(list, answers, tutorStore){
  // In tutor mode, "correct" means solved on the FIRST try (no wrong attempts) —
  // that's the real diagnostic signal, since tutor mode won't let a wrong final answer stand.
  let correct = 0;
  const tagStats = {}; // tag -> {correct, total}
  const sectionStats = {};
  list.forEach(q=>{
    let isCorrect;
    if(tutorStore){
      const prog = tutorStore[q.id];
      isCorrect = prog ? prog.wrongTried.size===0 : (answers[q.id]===q.answer);
    } else {
      isCorrect = answers[q.id] === q.answer;
    }
    if(isCorrect) correct++;
    if(!tagStats[q.tag]) tagStats[q.tag] = {correct:0,total:0};
    tagStats[q.tag].total++;
    if(isCorrect) tagStats[q.tag].correct++;
    const sk = q.sectionKey || "General";
    if(!sectionStats[sk]) sectionStats[sk] = {correct:0,total:0,label:q.sectionLabel||sk};
    sectionStats[sk].total++;
    if(isCorrect) sectionStats[sk].correct++;
  });
  return {correct, total:list.length, tagStats, sectionStats};
}

function finishTest(){
  const {tagStats} = scoreList(state.flatQuestions, state.answers, state.mode==="tutor" ? state.tutorProgress : null);
  updateTroubleLog(tagStats);
  clearInProgress();
  state.activeFlow = null;
  state.view = "results";
  render();
}

function renderResults(){
  const isTutor = state.mode === "tutor";
  const {correct, total, tagStats, sectionStats} = scoreList(state.flatQuestions, state.answers, isTutor ? state.tutorProgress : null);
  const pct = Math.round((correct/total)*100);

  // determine weak tags (below 60% correct, or missed at least one with <2 total questions)
  const weakTags = Object.keys(tagStats).filter(t=>{
    const s = tagStats[t];
    return (s.correct/s.total) < 0.7;
  });
  state.weakTags = weakTags;

  const sectionBars = Object.keys(sectionStats).map(sk=>{
    const s = sectionStats[sk];
    const p = Math.round((s.correct/s.total)*100);
    const cls = p<50?"weak":(p<80?"mid":"strong");
    return `<div class="skillBar">
      <div class="lbl"><span>${s.label}</span><span>${s.correct}/${s.total}</span></div>
      <div class="skillTrack"><div class="skillFill ${cls}" style="width:${p}%"></div></div>
    </div>`;
  }).join("");

  const tagBars = Object.keys(tagStats).map(tag=>{
    const s = tagStats[tag];
    const p = Math.round((s.correct/s.total)*100);
    const cls = p<50?"weak":(p<80?"mid":"strong");
    return `<div class="skillBar">
      <div class="lbl"><span>${tag.replace(/-/g,' ')}</span><span>${s.correct}/${s.total}</span></div>
      <div class="skillTrack"><div class="skillFill ${cls}" style="width:${p}%"></div></div>
    </div>`;
  }).join("");

  // missed questions review
  const missed = state.flatQuestions.filter(q=>{
    if(isTutor){
      const prog = state.tutorProgress[q.id];
      return prog && prog.wrongTried.size>0;
    }
    return state.answers[q.id]!==q.answer;
  });
  const missedHtml = missed.map(q=>{
    let wrongAnswerLine;
    if(isTutor){
      const prog = state.tutorProgress[q.id];
      const wrongLabels = Array.from(prog.wrongTried).map(i=>String.fromCharCode(65+i)+". "+q.choices[i]).join("; ");
      wrongAnswerLine = `First attempt(s) missed: ${wrongLabels} — got there on a later try.`;
    } else {
      const chosen = state.answers[q.id];
      wrongAnswerLine = `Your answer: ${chosen!==undefined?String.fromCharCode(65+chosen)+". "+q.choices[chosen]:"(skipped)"}`;
    }
    return `<div style="margin-bottom:22px;">
      <span class="qTag">${q.sectionLabel} · ${q.tag}</span>
      <div class="qtext" style="font-size:14px;">${parseUnderline(q.prompt)}</div>
      <div style="font-size:13px;color:var(--red);margin-bottom:4px;">${wrongAnswerLine}</div>
      <div style="font-size:13px;color:var(--green);margin-bottom:8px;">Correct: ${String.fromCharCode(65+q.answer)}. ${q.choices[q.answer]}</div>
      <div class="explain">${q.explain}</div>
    </div>`;
  }).join("");

  const lessonsHtml = weakTags.map(tag=>{
    const L = LESSONS[tag];
    if(!L) return "";
    return `<div class="lesson"><h4>${L.title}</h4><p>${L.body}</p></div>`;
  }).join("");

  app.innerHTML = `
    <div class="card">
      <h2 class="section-title">Score Report — ${TESTS[state.testKey].name}</h2>
      <div class="scoreRow">
        <p class="scoreBig">${correct}/${total}</p>
        <div>
          <div style="font-family:var(--mono);font-size:13px;color:var(--ink-soft);">${pct}% correct</div>
        </div>
      </div>
      <h3 style="font-size:14px;text-transform:uppercase;letter-spacing:1px;font-family:var(--mono);color:var(--ink-soft);margin-top:22px;">By Section</h3>
      ${sectionBars}
      <h3 style="font-size:14px;text-transform:uppercase;letter-spacing:1px;font-family:var(--mono);color:var(--ink-soft);margin-top:22px;">By Skill</h3>
      ${tagBars}
    </div>

    ${weakTags.length ? `
    <div class="card">
      <h2 class="section-title">Focus Lessons — Your Weak Spots</h2>
      ${lessonsHtml}
      <button class="primary" onclick="startRetest()">Start Targeted Retest (${weakTags.length} skill${weakTags.length>1?'s':''}) →</button>
    </div>` : `
    <div class="card"><h2 class="section-title">Strong across the board</h2><p style="color:var(--ink-soft);">No skill fell below 70% — nice work. Review the missed questions below if you want to double check anything.</p></div>
    `}

    ${missed.length ? `
    <div class="card">
      <h2 class="section-title">Review — Everything You Missed</h2>
      ${missedHtml}
    </div>` : `<div class="card"><h2 class="section-title">Review</h2><p style="color:var(--ink-soft);">You didn't miss a single question. Nothing to review.</p></div>`}

    <div class="card" style="text-align:center;">
      <button class="ghost" onclick="goHome()">← Back to test menu</button>
    </div>
  `;
}

function startRetest(){
  // build retest set from backup pool for weak tags, mapped to this test's section keys
  const testSectionKeys = TESTS[state.testKey].sections.map(s=>s.key);
  let pool = [];
  testSectionKeys.forEach(sk=>{
    const backupForSection = BACKUP[sk];
    if(!backupForSection) return;
    state.weakTags.forEach(tag=>{
      if(backupForSection[tag]){
        backupForSection[tag].forEach(q=>{
          pool.push(Object.assign({}, q, {sectionKey:sk, sectionLabel: TESTS[state.testKey].sections.find(s=>s.key===sk).label}));
        });
      }
    });
  });
  // de-dupe by id just in case
  const seen = new Set();
  pool = pool.filter(q=>{ if(seen.has(q.id)) return false; seen.add(q.id); return true; });

  state.retestQuestions = pool;
  state.retestAnswers = {};
  state.retestIndex = 0;
  state.retestTutorProgress = {};
  computeAndSetTimer(state.retestQuestions);
  state.view = "retest";
  render();
}

function finishRetest(){
  const isTutor = state.mode === "tutor";
  const {tagStats} = scoreList(state.retestQuestions, state.retestAnswers, isTutor ? state.retestTutorProgress : null);
  updateTroubleLog(tagStats);
  clearInProgress();
  state.activeFlow = null;
  state.view = "retestResults";
  render();
}

function renderRetestResults(){
  const isTutor = state.mode === "tutor";
  const {correct, total, tagStats} = scoreList(state.retestQuestions, state.retestAnswers, isTutor ? state.retestTutorProgress : null);
  const pct = total? Math.round((correct/total)*100) : 0;

  const stillWeak = Object.keys(tagStats).filter(t=>(tagStats[t].correct/tagStats[t].total)<0.7);
  const improved = state.weakTags.filter(t=>!stillWeak.includes(t) && tagStats[t]);

  const tagBars = Object.keys(tagStats).map(tag=>{
    const s = tagStats[tag];
    const p = Math.round((s.correct/s.total)*100);
    const cls = p<50?"weak":(p<80?"mid":"strong");
    return `<div class="skillBar">
      <div class="lbl"><span>${tag.replace(/-/g,' ')}</span><span>${s.correct}/${s.total}</span></div>
      <div class="skillTrack"><div class="skillFill ${cls}" style="width:${p}%"></div></div>
    </div>`;
  }).join("");

  app.innerHTML = `
    <div class="card">
      <h2 class="section-title">Retest Results</h2>
      <div class="scoreRow">
        <p class="scoreBig">${correct}/${total}</p>
        <div style="font-family:var(--mono);font-size:13px;color:var(--ink-soft);">${pct}% on your weak spots</div>
      </div>
      ${tagBars}
      ${improved.length ? `<p style="color:var(--green);font-size:14px;margin-top:14px;">✓ Improved to solid ground: ${improved.map(t=>t.replace(/-/g,' ')).join(', ')}</p>` : ""}
      ${stillWeak.length ? `<p style="color:var(--red);font-size:14px;">Still shaky: ${stillWeak.map(t=>t.replace(/-/g,' ')).join(', ')} — worth another look at the lesson above before your next full test.</p>` : `<p style="color:var(--green);font-size:14px;">Everything from your weak-spot list is now solid.</p>`}
      <div style="margin-top:20px;display:flex;gap:12px;">
        <button class="ghost" onclick="goHome()">← Back to test menu</button>
      </div>
    </div>
  `;
}

function goHome(){
  clearInProgress();
  state = {view:"home", testKey:null, mode:"test", activeFlow:null, flatQuestions:[], answers:{}, currentIndex:0, startedAt:null, retestQuestions:[], retestAnswers:{}, retestIndex:0, weakTags:[], tutorProgress:{}, retestTutorProgress:{}, timerEnabled:false, timerTotalSeconds:0, timerSecondsRemaining:0, timerPrefsUsed:null};
  render();
}

async function init(){
  const saved = await loadInProgress();
  if(saved && saved.flatQuestions){
    state.testKey = saved.testKey;
    state.mode = saved.mode;
    state.activeFlow = saved.activeFlow;
    state.weakTags = saved.weakTags || [];
    state.flatQuestions = saved.flatQuestions;
    state.answers = saved.answers || {};
    state.currentIndex = saved.currentIndex || 0;
    state.tutorProgress = deserializeTutorStore(saved.tutorProgress);
    state.retestQuestions = saved.retestQuestions || [];
    state.retestAnswers = saved.retestAnswers || {};
    state.retestIndex = saved.retestIndex || 0;
    state.retestTutorProgress = deserializeTutorStore(saved.retestTutorProgress);
    state.timerEnabled = saved.timerEnabled || false;
    state.timerTotalSeconds = saved.timerTotalSeconds || 0;
    state.timerSecondsRemaining = (typeof saved.timerSecondsRemaining === "number") ? saved.timerSecondsRemaining : 0;
    state.timerPrefsUsed = saved.timerPrefsUsed || null;
  }
  state.view = "home"; // always land on the menu; the resume bar offers the way back in
  render();
}
init();
</script>
</body>
</html>
